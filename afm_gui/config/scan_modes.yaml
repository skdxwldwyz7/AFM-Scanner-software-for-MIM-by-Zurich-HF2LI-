default_mode: fm_afm

modes:
  fm_afm:
    enabled: true
    label: FM-AFM / HF2 AUX XY
    default_display_count: 4
    channels:
      - name: auxout3
        label: Aux Out 3 / Z PID output
        unit: V
        enabled: true
      - name: auxout4
        label: Aux Out 4 / PLL Δf output
        unit: V
        enabled: true
      - name: pll_df
        label: PLL frequency shift
        unit: Hz
        enabled: true
      - name: r
        label: Demod amplitude R
        unit: V
        enabled: false
      - name: pid_error
        label: Z PID error
        unit: V
        enabled: true
      - name: frequency
        label: Tracked frequency
        unit: Hz
        enabled: true
      - name: pll_error
        label: PLL phase error
        unit: deg
        enabled: false
      - name: pll_locked
        label: PLL locked
        unit: ''
        enabled: false
      - name: pll_enabled
        label: PLL enabled
        unit: ''
        enabled: false
      - name: pll_center
        label: PLL center frequency
        unit: Hz
        enabled: false
      - name: pll_range
        label: PLL frequency range
        unit: Hz
        enabled: false
      - name: pll_setpoint
        label: PLL phase setpoint
        unit: deg
        enabled: false
      - name: x
        label: Demod X
        unit: V
        enabled: false
      - name: y
        label: Demod Y
        unit: V
        enabled: false
      - name: theta
        label: Demod phase
        unit: deg
        enabled: false
      - name: auxin1
        label: Aux In 1 / df voltage
        unit: V
        enabled: false
      - name: auxin2
        label: Aux In 2
        unit: V
        enabled: false
      - name: pid_shift
        label: Z PID shift
        unit: V
        enabled: false
      - name: pid_out
        label: Z PID center + shift (derived)
        unit: V
        enabled: false
      - name: pid_enabled
        label: Z PID enabled
        unit: ''
        enabled: false
      - name: pid_setpoint
        label: Z PID setpoint
        unit: V
        enabled: false
      - name: pid_center
        label: Z PID center
        unit: V
        enabled: false
      - name: pid_range
        label: Z PID range
        unit: V
        enabled: false
      - name: pid_at_limit
        label: Z PID at limit (derived)
        unit: ''
        enabled: false
      - name: auxout1
        label: Aux Out 1 / X
        unit: V
        enabled: false
      - name: auxout2
        label: Aux Out 2 / Y
        unit: V
        enabled: false
      - name: aux4_scale
        label: Aux 4 scale
        unit: V/Hz
        enabled: false
      - name: aux4_offset
        label: Aux 4 offset
        unit: V
        enabled: false
      - name: loopback_error
        label: Aux In 1 - Aux Out 4 (derived)
        unit: V
        enabled: false

  topo:
    enabled: false
    label: Topography
    default_display_count: 4
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: error
        label: Error
        unit: ""
        enabled: true
      - name: amplitude
        label: Amplitude
        unit: V
        enabled: true
      - name: phase
        label: Phase
        unit: deg
        enabled: true

  lockin:
    enabled: true
    label: Lock-in Scan
    default_display_count: 4
    channels:
      - name: signal_a
        label: A
        unit: ""
        enabled: true
      - name: signal_b
        label: B
        unit: ""
        enabled: true
      - name: signal_c
        label: C
        unit: ""
        enabled: false
      - name: signal_d
        label: D
        unit: ""
        enabled: false

  spectroscopy:
    enabled: false
    label: Spectroscopy Map
    default_display_count: 3
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: current
        label: Current
        unit: A
        enabled: true
      - name: didv
        label: dI/dV
        unit: S
        enabled: true
      - name: bias
        label: Bias
        unit: V
        enabled: false

  lift:
    enabled: false
    label: Lift Mode
    default_display_count: 4
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: lift_height
        label: Lift Height
        unit: nm
        enabled: true
      - name: magnetic_phase
        label: Magnetic Phase
        unit: deg
        enabled: true
      - name: amplitude
        label: Amplitude
        unit: V
        enabled: true
