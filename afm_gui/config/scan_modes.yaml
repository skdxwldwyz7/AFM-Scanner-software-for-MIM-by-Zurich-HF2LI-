default_mode: lockin

modes:
  topo:
    enabled: false
    label: Topography
    default_display_count: 4
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: error
        label: Error
        unit: ""
        enabled: true
      - name: amplitude
        label: Amplitude
        unit: V
        enabled: true
      - name: phase
        label: Phase
        unit: deg
        enabled: true

  lockin:
    enabled: true
    label: Lock-in Scan
    default_display_count: 4
    channels:
      - name: signal_a
        label: A
        unit: ""
        enabled: true
      - name: signal_b
        label: B
        unit: ""
        enabled: true
      - name: signal_c
        label: C
        unit: ""
        enabled: false
      - name: signal_d
        label: D
        unit: ""
        enabled: false

  spectroscopy:
    enabled: false
    label: Spectroscopy Map
    default_display_count: 3
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: current
        label: Current
        unit: A
        enabled: true
      - name: didv
        label: dI/dV
        unit: S
        enabled: true
      - name: bias
        label: Bias
        unit: V
        enabled: false

  lift:
    enabled: false
    label: Lift Mode
    default_display_count: 4
    channels:
      - name: topography
        label: Topography
        unit: nm
        enabled: true
      - name: lift_height
        label: Lift Height
        unit: nm
        enabled: true
      - name: magnetic_phase
        label: Magnetic Phase
        unit: deg
        enabled: true
      - name: amplitude
        label: Amplitude
        unit: V
        enabled: true
